<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <title>Tous les Templates - NotionbyMat</title>
    <meta name="description" content="Catalogue complet de templates Notion. Filtrez par catégorie : productivité, business, finance, gratuits...">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <!-- Header -->
    <div id="header"></div>

    <div class="section-header" style="margin-top: 60px;">
        <h2 data-i18n="templates.title">All Templates</h2>
        <p data-i18n="templates.subtitle">Find the perfect tool</p>
    </div>

    <div class="templates">
        <!-- Filters -->
        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all" data-i18n="filter.all">All</button>
            <button class="filter-btn" data-filter="free" data-i18n="filter.free">Free</button>
            <button class="filter-btn" data-filter="productivity" data-i18n="filter.productivity">Productivity</button>
            <button class="filter-btn" data-filter="business" data-i18n="filter.business">Business</button>
            <button class="filter-btn" data-filter="creative" data-i18n="filter.creative">Creative</button>
            <button class="filter-btn" data-filter="finance" data-i18n="filter.finance">Finance</button>
            <button class="filter-btn" data-filter="personal" data-i18n="filter.personal">Personal</button>
        </div>

        <!-- Grid -->
        <div class="templates-grid" id="templatesGrid"></div>
    </div>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="translations.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <script>
        $(document).ready(function() {
            $("#header").load("header.html");
            $("#footer").load("footer.html");
        });
    </script>
</body>
</html>
